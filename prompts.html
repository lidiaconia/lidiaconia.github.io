            display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.2rem; border-radius: 999px;

        }
        .btn:hover { border-color: rgba(192, 132, 252, 0.6); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(2, 6, 23, 0.4); }
        .btn.primary { background: var(--gradient); border: none; color: #0f172a; }
        .btn.primary:hover { box-shadow: 0 0 30px rgba(192, 132, 252, 0.45); }

        .empty {
            text-align: center; padding: 2.5rem 1.5rem; border-radius: 16px;
            background: var(--card); border: 1px dashed var(--border);
        }
        .empty i { font-size: 2rem; color: var(--purple); margin-bottom: 0.8rem; }
        .empty h2 { font-size: 1.2rem; font-weight: 700; }
        .empty p { color: var(--muted); margin-top: 0.4rem; }
